            {"qnum": "Q45", "category": "Permits & Specs", "question": "Will you require 24/7 emergency support?", "ptl2": "Rugged closed-loop design minimizes service calls; local failure alarms on-site.", "sq3ts": "Dual-processor MMS prevents unsafe signal states during emergency faults.", "pts2000": "Built-in diagnostic logs allow quick troubleshooting during service calls.", "winner": "SQ3TS"}, 
            {"qnum": "Q46", "category": "Permits & Specs", "question": "How quickly must service personnel respond if a signal malfunctions?", "ptl2": "System automatically drops to red-flash safety mode upon fault detection.", "sq3ts": "Dual MMS guarantees fail-safe red flash protection while technician is en route.", "pts2000": "Automatic conflict shutdown ensures site safety during response window.", "winner": "SQ3TS"}, 
            {"qnum": "Q47", "category": "Permits & Specs", "question": "Who will monitor the equipment during off-hours?", "ptl2": "In zero-cell zones, physical daily/weekly drive-by checks replace app alerts.", "sq3ts": "In zero-cell zones, visual inspection of external LED status lamps is required.", "pts2000": "External voltage meter allows instant visual inspection by off-hour guards.", "winner": "PTL2-4X"}, 
            {"qnum": "Q48", "category": "Permits & Specs", "question": "Will daily inspections be required?", "ptl2": "External battery meters and clear status LEDs make daily drive-by checks instant.", "sq3ts": "External voltage display allows 5-second visual drive-by verification.", "pts2000": "Standard external voltage meter allows quick daily visual check from pickup cab.", "winner": "PTL2-4X"}, 
            {"qnum": "Q49", "category": "Industry & Heavy Ops", "question": "Which operator or energy company owns the lease?", "ptl2": "Satisfies strict oil/gas operator safety and environmental compliance standards.", "sq3ts": "Meets heavy industrial and energy sector work-zone safety specifications.", "pts2000": "Meets industrial leasehold access traffic management requirements.", "winner": "PTL2-4X"}, 
            {"qnum": "Q50", "category": "Permits & Specs", "question": "Will heavy haul water trucks use the route?", "ptl2": "Heavy-duty construction withstands constant ground vibration from heavy haulers.", "sq3ts": "100-mph wind load frame resists severe air blast and vibration from passing tankers.", "pts2000": "Type 4 trailer chassis resists vibration-induced component loosening.", "winner": "SQ3TS"}, 
            {"qnum": "Q51", "category": "Industry & Heavy Ops", "question": "What is the maximum truck volume expected per hour?", "ptl2": "Radar actuation adjusts green extension to prevent long queues of heavy water trucks.", "sq3ts": "Queue-detection radar extends green signal until heavy truck convoy clears.", "pts2000": "Microwave radar holds green light for heavy truck lines to maintain momentum.", "winner": "SQ3TS"}, 
            {"qnum": "Q52", "category": "Industry & Heavy Ops", "question": "Are there periods when convoy traffic is expected?", "ptl2": "Programmable maximum green extensions accommodate long multi-truck convoys.", "sq3ts": "Extended green hold parameters prevent splitting heavy truck convoys.", "pts2000": "Galaxy\u00ae controller adjusts phase duration to clear entire truck convoys.", "winner": "PTL2-4X"}, 
            {"qnum": "Q53", "category": "Industry & Heavy Ops", "question": "Will drilling or fracking operations require around-the-clock access?", "ptl2": "30-day autonomous battery/solar reserve ensures non-stop 24/7 industrial runtime.", "sq3ts": "600W solar capacity supports continuous high-frequency 24/7 industrial traffic.", "pts2000": "Heavy battery bank supports non-stop 24/7 industrial haulage cycles.", "winner": "SQ3TS"}, 
            {"qnum": "Q54", "category": "Industry & Heavy Ops", "question": "Are there any hazardous-material transportation requirements?", "ptl2": "Failsafe red-flash conflict monitoring prevents hazardous material collisions.", "sq3ts": "Dual-processor MMS conflict monitoring provides maximum safety for HAZMAT routes.", "pts2000": "NEMA TS-5 compliance ensures strict safety controls for HAZMAT transport.", "winner": "SQ3TS"}, 
            {"qnum": "Q55", "category": "Industry & Heavy Ops", "question": "Is there a designated emergency evacuation route?", "ptl2": "Manual hold-green preemption clears evacuation traffic instantly if needed.", "sq3ts": "Emergency preemption inputs allow immediate flush of evacuation corridors.", "pts2000": "Manual override capabilities enable quick clearing of emergency traffic.", "winner": "PTL2-4X"}, 
            {"qnum": "Q56", "category": "Industry & Heavy Ops", "question": "Will dust, mud, or snow impact signal visibility or operation?", "ptl2": "Sealed NEMA 4 weather-proof cabinets protect electronics; visor hoods protect LEDs.", "sq3ts": "Enclosed weatherproof battery/control boxes keep out heavy dust, mud, and snow.", "pts2000": "Weatherproof cabinet design with hooded LED visors prevents snow buildup.", "winner": "PTL2-4X"}
        ];

        let answeredCount = 0;
        let questionWinners = {};

        // Group data by category
        const categories = {};
        rawData.forEach((q, i) => {
            if (!categories[q.category]) categories[q.category] = [];
            q.globalIndex = i;
            categories[q.category].push(q);
        });

        const sidebar = document.getElementById('sidebar-nav');
        const mainForm = document.getElementById('audit-form-container');

        // Build the Sidebar Scoreboard HTML
        const scoreboardHTML = `
            <div class="scoreboard">
                <div class="sb-title">Live Compatibility</div>
                
                <div class="sb-row">
                    <div class="sb-row-header"><span>PTL2.4x</span> <span id="sb-ptl-pct" style="color: #CCFF00;">0%</span></div>
                    <div class="progress-bg"><div class="progress-fill" id="sb-ptl-bar"></div></div>
                    <div class="sb-tally" id="sb-ptl-tally">0 of 0 matches</div>
                </div>

                <div class="sb-row">
                    <div class="sb-row-header"><span>SQ3TS</span> <span id="sb-sq3-pct" style="color: #CCFF00;">0%</span></div>
                    <div class="progress-bg"><div class="progress-fill" id="sb-sq3-bar"></div></div>
                    <div class="sb-tally" id="sb-sq3-tally">0 of 0 matches</div>
                </div>

                <div class="sb-row">
                    <div class="sb-row-header"><span>PTS-2000</span> <span id="sb-pts-pct" style="color: #CCFF00;">0%</span></div>
                    <div class="progress-bg"><div class="progress-fill" id="sb-pts-bar"></div></div>
                    <div class="sb-tally" id="sb-pts-tally">0 of 0 matches</div>
                </div>
            </div>
            <div class="sidebar-title" style="margin-top: 1rem;">Categories</div>
        `;
        sidebar.innerHTML = scoreboardHTML;

        // Build the layout dynamically
        Object.keys(categories).forEach(cat => {
            const catId = cat.replace(/\s+/g, '-').replace('&', 'and').toLowerCase();
            
            // Add sidebar link
            const link = document.createElement('a');
            link.href = `#${catId}`;
            link.className = 'cat-link';
            link.innerText = cat;
            sidebar.appendChild(link);

            // Add main section
            const section = document.createElement('div');
            section.className = 'category-section';
            section.id = catId;
            
            const header = document.createElement('div');
            header.className = 'category-header';
            header.innerText = cat;
            section.appendChild(header);

            // Add questions to section
            categories[cat].forEach(q => {
                const card = document.createElement('div');
                card.className = 'q-card';
                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-num">${q.qnum}</span>
                        <span class="q-text">${q.question}</span>
                    </div>
                    <div class="input-row">
                        <input type="text" id="ans-${q.globalIndex}" class="text-bubble" placeholder="Type client's answer here (leave blank & hit enter to delete)..." onkeypress="handleKeyPress(event, ${q.globalIndex})">
                        <button class="eval-btn" onclick="evaluateAnswer(${q.globalIndex})">Evaluate Best Unit</button>
                    </div>
                    <div class="result-banner" id="res-${q.globalIndex}">
                        <span class="winner-tag" id="tag-${q.globalIndex}"></span>
                        <div class="reason-text" id="reason-${q.globalIndex}"></div>
                    </div>
                `;
                section.appendChild(card);
            });

            mainForm.appendChild(section);
        });

        function handleKeyPress(e, idx) {
            if (e.key === 'Enter') evaluateAnswer(idx);
        }

        function evaluateAnswer(idx) {
            const q = rawData[idx];
            const ansBox = document.getElementById(`ans-${idx}`);
            const resBanner = document.getElementById(`res-${idx}`);
            const tagEl = document.getElementById(`tag-${idx}`);
            const reasonEl = document.getElementById(`reason-${idx}`);
            
            const ansText = ansBox.value.toLowerCase().trim();
            
            // If the user cleared the text box, handle deletion (rollback)
            if (ansText === '') {
                if (ansBox.dataset.answered === "true") {
                    ansBox.dataset.answered = "false";
                    answeredCount--;
                    document.getElementById('answered-count').innerText = `${answeredCount} / 56`;
                    delete questionWinners[idx]; 
                    resBanner.classList.remove('active'); 
                    updateScoreboard(); 
                }
                return; 
            }

            // Mark as answered
            if (ansBox.dataset.answered !== "true") {
                ansBox.dataset.answered = "true";
                answeredCount++;
                document.getElementById('answered-count').innerText = `${answeredCount} / 56`;
            }

            let winningUnit = q.winner; // Start with the benchmark winner

            // Advanced Keyword Correlation to override default
            if (ansText.includes('7 mile') || ansText.includes('yagi') || ansText.includes('mountain') || ansText.includes('zero cell') || ansText.includes('20 trailers') || ansText.includes('agm') || ansText.includes('network')) {
                winningUnit = 'PTL2-4X';
            } else if (ansText.includes('solar') || ansText.includes('lay flat') || ansText.includes('lay-flat') || ansText.includes('wind') || ansText.includes('100 mph') || ansText.includes('radar') || ansText.includes('mms') || ansText.includes('queue')) {
                winningUnit = 'SQ3TS';
            } else if (ansText.includes('compact') || ansText.includes('gravel') || ansText.includes('tight') || ansText.includes('shoulder') || ansText.includes('tongue') || ansText.includes('relocate')) {
                winningUnit = 'PTS-2000';
            }

            // Map the selected winner back to its actual specific engineering text for this question
            let specKey = 'ptl2';
            if (winningUnit === 'SQ3TS') specKey = 'sq3ts';
            if (winningUnit === 'PTS-2000') specKey = 'pts2000';

            // Generate the dynamic HTML explanation pulling directly from the machine's capabilities
            let explanationHTML = `Based on answer "${ansBox.value}": <strong>${winningUnit}</strong> is recommended.<br><br><strong style="color:#CCFF00;">Direct Capability Match:</strong> ${q[specKey]}`;

            // Save the winner for tallying
            questionWinners[idx] = winningUnit;

            // Show UI banner
            tagEl.innerText = `WINNER: ${winningUnit}`;
            reasonEl.innerHTML = explanationHTML;
            resBanner.classList.add('active');
            
            // Highlight animation
            ansBox.style.borderColor = '#CCFF00';
            setTimeout(() => ansBox.style.borderColor = '#233529', 1000);

            // Update running tally
            updateScoreboard();
        }

        function updateScoreboard() {
            let ptl = 0, sq3 = 0, pts = 0;
            let total = answeredCount;

            // Count the saved winners
            for (let key in questionWinners) {
                let w = questionWinners[key];
                if (w.includes('PTL')) ptl++;
                else if (w.includes('SQ3')) sq3++;
                else if (w.includes('PTS')) pts++;
            }

            // Calculate percentages
            let ptlPct = total > 0 ? Math.round((ptl / total) * 100) : 0;
            let sq3Pct = total > 0 ? Math.round((sq3 / total) * 100) : 0;
            let ptsPct = total > 0 ? Math.round((pts / total) * 100) : 0;

            // Update UI percentages
            document.getElementById('sb-ptl-pct').innerText = ptlPct + '%';
            document.getElementById('sb-sq3-pct').innerText = sq3Pct + '%';
            document.getElementById('sb-pts-pct').innerText = ptsPct + '%';

            // Update UI tallies
            document.getElementById('sb-ptl-tally').innerText = ptl + ' of ' + total + ' matches';
            document.getElementById('sb-sq3-tally').innerText = sq3 + ' of ' + total + ' matches';
            document.getElementById('sb-pts-tally').innerText = pts + ' of ' + total + ' matches';

            // Update UI progress bars
            document.getElementById('sb-ptl-bar').style.width = ptlPct + '%';
            document.getElementById('sb-sq3-bar').style.width = sq3Pct + '%';
            document.getElementById('sb-pts-bar').style.width = ptsPct + '%';
        }
    </script>
</body>
</html>
