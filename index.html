            {"qnum": "Q39", "category": "Permits & Specs", "question": "Are there any special permit conditions?", "ptl2": "Flexible programming accommodates unique permit rules (e.g., maximum queue lengths).", "sq3ts": "Supports customized cycle limits or specific operational hours mandated by permit.", "winner": "SQ3TS"}, 
            {"qnum": "Q40", "category": "Permits & Specs", "question": "Can our technicians access the site with pickup trucks?", "ptl2": "Standard 2-5/16\" ball hitch or pintle hook allows easy towing via 3/4-ton pickup truck.", "sq3ts": "Towable by standard commercial pickup trucks with heavy-duty hitch receiver.", "winner": "PTL2-4X"}, 
            {"qnum": "Q41", "category": "Permits & Specs", "question": "Are there weight restrictions?", "ptl2": "Trailer weight (~3,000 lbs) complies with standard bridge and unpaved road limits.", "sq3ts": "Compact heavy frame (~2,500 lbs) easily crosses weight-restricted rural bridges.", "winner": "SQ3TS"}, 
            {"qnum": "Q42", "category": "Permits & Specs", "question": "Will escorts be required?", "ptl2": "Rapid setup features allow fast off-road positioning to minimize escort window.", "sq3ts": "Quick-deploy outriggers reduce lane-blocking time during initial setup.", "winner": "PTL2-4X"}, 
            {"qnum": "Q43", "category": "Permits & Specs", "question": "Is the site accessible during all weather conditions?", "ptl2": "Rugged enclosure protects batteries and electronics from severe snow/ice storms.", "sq3ts": "Heavy structural frame withstands severe mountain weather, snow, and 100-mph winds.", "winner": "SQ3TS"}, 
            {"qnum": "Q44", "category": "Permits & Specs", "question": "Who is the onsite contact for deliveries and service calls?", "ptl2": "Onboard storage box holds laminated quick-start guide for on-site personnel.", "sq3ts": "Clear cabinet labeling allows on-site contacts to communicate status via phone.", "winner": "PTL2-4X"}, 
            {"qnum": "Q45", "category": "Permits & Specs", "question": "Will you require 24/7 emergency support?", "ptl2": "Rugged closed-loop design minimizes service calls; local failure alarms on-site.", "sq3ts": "Dual-processor MMS prevents unsafe signal states during emergency faults.", "winner": "SQ3TS"}, 
            {"qnum": "Q46", "category": "Permits & Specs", "question": "How quickly must service personnel respond if a signal malfunctions?", "ptl2": "System automatically drops to red-flash safety mode upon fault detection.", "sq3ts": "Dual MMS guarantees fail-safe red flash protection while technician is en route.", "winner": "SQ3TS"}, 
            {"qnum": "Q47", "category": "Permits & Specs", "question": "Who will monitor the equipment during off-hours?", "ptl2": "In zero-cell zones, physical daily/weekly drive-by checks replace app alerts.", "sq3ts": "In zero-cell zones, visual inspection of external LED status lamps is required.", "winner": "PTL2-4X"}, 
            {"qnum": "Q48", "category": "Permits & Specs", "question": "Will daily inspections be required?", "ptl2": "External battery meters and clear status LEDs make daily drive-by checks instant.", "sq3ts": "External voltage display allows 5-second visual drive-by verification.", "winner": "PTL2-4X"}, 
            {"qnum": "Q49", "category": "Industry & Heavy Ops", "question": "Which operator or energy company owns the lease?", "ptl2": "Satisfies strict oil/gas operator safety and environmental compliance standards.", "sq3ts": "Meets heavy industrial and energy sector work-zone safety specifications.", "winner": "PTL2-4X"}, 
            {"qnum": "Q50", "category": "Industry & Heavy Ops", "question": "Will heavy haul water trucks use the route?", "ptl2": "Heavy-duty construction withstands constant ground vibration from heavy haulers.", "sq3ts": "100-mph wind load frame resists severe air blast and vibration from passing tankers.", "winner": "SQ3TS"}, 
            {"qnum": "Q51", "category": "Industry & Heavy Ops", "question": "What is the maximum truck volume expected per hour?", "ptl2": "Radar actuation adjusts green extension to prevent long queues of heavy water trucks.", "sq3ts": "Queue-detection radar extends green signal until heavy truck convoy clears.", "winner": "SQ3TS"}, 
            {"qnum": "Q52", "category": "Industry & Heavy Ops", "question": "Are there periods when convoy traffic is expected?", "ptl2": "Programmable maximum green extensions accommodate long multi-truck convoys.", "sq3ts": "Extended green hold parameters prevent splitting heavy truck convoys.", "winner": "PTL2-4X"}, 
            {"qnum": "Q53", "category": "Industry & Heavy Ops", "question": "Will drilling or fracking operations require around-the-clock access?", "ptl2": "30-day autonomous battery/solar reserve ensures non-stop 24/7 industrial runtime.", "sq3ts": "600W solar capacity supports continuous high-frequency 24/7 industrial traffic.", "winner": "SQ3TS"}, 
            {"qnum": "Q54", "category": "Industry & Heavy Ops", "question": "Are there any hazardous-material transportation requirements?", "ptl2": "Failsafe red-flash conflict monitoring prevents hazardous material collisions.", "sq3ts": "Dual-processor MMS conflict monitoring provides maximum safety for HAZMAT routes.", "winner": "SQ3TS"}, 
            {"qnum": "Q55", "category": "Industry & Heavy Ops", "question": "Is there a designated emergency evacuation route?", "ptl2": "Manual hold-green preemption clears evacuation traffic instantly if needed.", "sq3ts": "Emergency preemption inputs allow immediate flush of evacuation corridors.", "winner": "PTL2-4X"}, 
            {"qnum": "Q56", "category": "Industry & Heavy Ops", "question": "Will dust, mud, or snow impact signal visibility or operation?", "ptl2": "Sealed NEMA 4 weather-proof cabinets protect electronics; visor hoods protect LEDs.", "sq3ts": "Enclosed weatherproof battery/control boxes keep out heavy dust, mud, and snow.", "winner": "PTL2-4X"}
        ];

        let answeredCount = 0;
        let questionWinners = {};
        let clientAnswersStore = {};

        // Group data by category
        const categories = {};
        rawData.forEach((q, i) => {
            if (!categories[q.category]) categories[q.category] = [];
            q.globalIndex = i;
            categories[q.category].push(q);
        });

        const sidebar = document.getElementById('sidebar-nav');
        const mainForm = document.getElementById('audit-form-container');

        // Build the Sidebar Scoreboard HTML (2 Units Only)
        const scoreboardHTML = `
            <div class="scoreboard">
                <div class="sb-title">Live Compatibility (2 Units)</div>
                
                <div class="sb-row">
                    <div class="sb-row-header"><span>NAT PTL2.4x</span> <span id="sb-ptl-pct" style="color: #CCFF00;">0%</span></div>
                    <div class="progress-bg"><div class="progress-fill" id="sb-ptl-bar"></div></div>
                    <div class="sb-tally" id="sb-ptl-tally">0 of 0 matches</div>
                </div>

                <div class="sb-row">
                    <div class="sb-row-header"><span>Horizon SQ3TS</span> <span id="sb-sq3-pct" style="color: #CCFF00;">0%</span></div>
                    <div class="progress-bg"><div class="progress-fill" id="sb-sq3-bar"></div></div>
                    <div class="sb-tally" id="sb-sq3-tally">0 of 0 matches</div>
                </div>
            </div>
            <div class="sidebar-title" style="margin-top: 1rem;">Categories</div>
        `;
        sidebar.innerHTML = scoreboardHTML;

        // Build the layout dynamically
        Object.keys(categories).forEach(cat => {
            const catId = cat.replace(/\s+/g, '-').replace('&', 'and').toLowerCase();
            
            const link = document.createElement('a');
            link.href = `#${catId}`;
            link.className = 'cat-link';
            link.innerText = cat;
            sidebar.appendChild(link);

            const section = document.createElement('div');
            section.className = 'category-section';
            section.id = catId;
            
            const header = document.createElement('div');
            header.className = 'category-header';
            header.innerText = cat;
            section.appendChild(header);

            categories[cat].forEach(q => {
                const card = document.createElement('div');
                card.className = 'q-card';
                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-num">${q.qnum}</span>
                        <span class="q-text">${q.question}</span>
                    </div>
                    <div class="input-row">
                        <input type="text" id="ans-${q.globalIndex}" class="text-bubble" placeholder="Type client's answer here (leave blank & hit enter to delete)..." onkeypress="handleKeyPress(event, ${q.globalIndex})">
                        <button class="eval-btn" onclick="evaluateAnswer(${q.globalIndex})">Evaluate Best Unit</button>
                    </div>
                    <div class="result-banner" id="res-${q.globalIndex}">
                        <span class="winner-tag" id="tag-${q.globalIndex}"></span>
                        <div class="reason-text" id="reason-${q.globalIndex}"></div>
                    </div>
                `;
                section.appendChild(card);
            });

            mainForm.appendChild(section);
        });

        function handleKeyPress(e, idx) {
            if (e.key === 'Enter') evaluateAnswer(idx);
        }

        function evaluateAnswer(idx) {
            const q = rawData[idx];
            const ansBox = document.getElementById(`ans-${idx}`);
            const resBanner = document.getElementById(`res-${idx}`);
            const tagEl = document.getElementById(`tag-${idx}`);
            const reasonEl = document.getElementById(`reason-${idx}`);
            
            const ansText = ansBox.value.toLowerCase().trim();
            
            if (ansText === '') {
                if (ansBox.dataset.answered === "true") {
                    ansBox.dataset.answered = "false";
                    answeredCount--;
                    document.getElementById('answered-count').innerText = `${answeredCount} / 56`;
                    delete questionWinners[idx]; 
                    delete clientAnswersStore[idx];
                    resBanner.classList.remove('active'); 
                    updateScoreboard(); 
                }
                return; 
            }

            if (ansBox.dataset.answered !== "true") {
                ansBox.dataset.answered = "true";
                answeredCount++;
                document.getElementById('answered-count').innerText = `${answeredCount} / 56`;
            }

            let winningUnit = q.winner; 

            if (ansText.includes('7 mile') || ansText.includes('yagi') || ansText.includes('mountain') || ansText.includes('zero cell') || ansText.includes('20 trailers') || ansText.includes('agm') || ansText.includes('network')) {
                winningUnit = 'PTL2-4X';
            } else if (ansText.includes('solar') || ansText.includes('lay flat') || ansText.includes('lay-flat') || ansText.includes('wind') || ansText.includes('100 mph') || ansText.includes('radar') || ansText.includes('mms') || ansText.includes('queue') || ansText.includes('24 hour') || ansText.includes('24/7') || ansText.includes('shift')) {
                winningUnit = 'SQ3TS';
            }

            let specKey = (winningUnit === 'SQ3TS') ? 'sq3ts' : 'ptl2';
            let unitDisplayName = (winningUnit === 'SQ3TS') ? 'Horizon SQ3TS' : 'NAT PTL2.4x';

            let explanationHTML = `Based on answer "${ansBox.value}": <strong>${unitDisplayName}</strong> is recommended.<br><br><strong style="color:#CCFF00;">Direct Capability Match:</strong> ${q[specKey]}`;

            questionWinners[idx] = unitDisplayName;
            clientAnswersStore[idx] = { question: q.question, category: q.category, answer: ansBox.value, winner: unitDisplayName, rationale: q[specKey] };

            tagEl.innerText = `WINNER: ${unitDisplayName}`;
            reasonEl.innerHTML = explanationHTML;
            resBanner.classList.add('active');
            
            ansBox.style.borderColor = '#CCFF00';
            setTimeout(() => ansBox.style.borderColor = '#233529', 1000);

            updateScoreboard();
        }

        function updateScoreboard() {
            let ptl = 0, sq3 = 0;
            let total = answeredCount;

            for (let key in questionWinners) {
                let w = questionWinners[key];
                if (w.includes('PTL')) ptl++;
                else if (w.includes('SQ3')) sq3++;
            }

            let ptlPct = total > 0 ? Math.round((ptl / total) * 100) : 0;
            let sq3Pct = total > 0 ? Math.round((sq3 / total) * 100) : 0;

            document.getElementById('sb-ptl-pct').innerText = ptlPct + '%';
            document.getElementById('sb-sq3-pct').innerText = sq3Pct + '%';

            document.getElementById('sb-ptl-tally').innerText = ptl + ' of ' + total + ' matches';
            document.getElementById('sb-sq3-tally').innerText = sq3 + ' of ' + total + ' matches';

            document.getElementById('sb-ptl-bar').style.width = ptlPct + '%';
            document.getElementById('sb-sq3-bar').style.width = sq3Pct + '%';
        }

        function generateSOW() {
            const modal = document.getElementById('sow-modal');
            const bodyContent = document.getElementById('sow-body-content');

            const answeredIndices = Object.keys(clientAnswersStore);
            if (answeredIndices.length === 0) {
                bodyContent.innerHTML = `<div style="color: #94A3B8; text-align: center; padding: 2rem;">Please answer at least one discovery question in the audit form before generating the Statement of Work.</div>`;
                modal.classList.add('active');
                return;
            }

            let ptlWins = 0, sq3Wins = 0;
            Object.values(questionWinners).forEach(w => {
                if (w.includes('PTL')) ptlWins++;
                else if (w.includes('SQ3')) sq3Wins++;
            });

            let recommendedSystem = (ptlWins >= sq3Wins) ? 'North America Traffic PTL2.4x (Flagship)' : 'Horizon Signal SQ3TS';

            let html = `
                <div class="sow-doc-section">
                    <div class="sow-doc-title">1. Executive Summary & Recommended System</div>
                    <p>Based on the discovery audit of <strong>${answeredCount}</strong> analyzed parameters, the recommended portable traffic signal system for this project is <strong>${recommendedSystem}</strong>.</p>
                    <p style="margin-top: 0.5rem; color: #CBD5E1;">Compatibility Breakdown: NAT PTL2.4x (${ptlWins} matches) | Horizon SQ3TS (${sq3Wins} matches).</p>
                </div>

                <div class="sow-doc-section">
                    <div class="sow-doc-title">2. Operational Parameters & Client Requirements</div>
            `;

            const groupedSOW = {};
            answeredIndices.forEach(idx => {
                const item = clientAnswersStore[idx];
                if (!groupedSOW[item.category]) groupedSOW[item.category] = [];
                groupedSOW[item.category].push(item);
            });

            Object.keys(groupedSOW).forEach(cat => {
                html += `<div style="margin-top: 1rem; font-weight: 700; color: #CCFF00; font-size: 0.9rem; text-transform: uppercase;">${cat}</div>`;
                html += `<ul style="margin-left: 1.5rem; margin-top: 0.35rem; display: flex; flex-direction: column; gap: 0.5rem;">`;
                groupedSOW[cat].forEach(entry => {
                    html += `<li><strong>${entry.question}</strong><br><span style="color: #CBD5E1;">Client Input: "${entry.answer}"</span> <span style="color: #CCFF00; font-size: 0.85rem;">[Recommended: ${entry.winner}]</span></li>`;
                });
                html += `</ul>`;
            });

            html += `
                </div>
                <div class="sow-doc-section">
                    <div class="sow-doc-title">3. Technical Justification & Compliance</div>
                    <p>The selected hardware complies with MUTCD and NEMA TS-5 standards, featuring robust autonomous battery backup and reliable communication architecture tailored to the site conditions specified above.</p>
                </div>
            `;

            bodyContent.innerHTML = html;
            modal.classList.add('active');
        }

        function closeSOWModal() {
            document.getElementById('sow-modal').classList.remove('active');
        }
    </script>
</body>
</html>
