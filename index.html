<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Discovery Audit & Contractual SOW Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0A0F0D;
            color: #F1F5F9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #141E18;
            border-bottom: 1px solid #233529;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .brand-badge {
            background: #CCFF00;
            color: #0A0F0D;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            letter-spacing: 0.05em;
        }
        .brand-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #F8FAFC;
        }
        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .sow-btn {
            background: #CCFF00;
            color: #0A0F0D;
            border: none;
            padding: 0.65rem 1.25rem;
            font-weight: 800;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sow-btn:hover {
            background: #b3e000;
            transform: translateY(-1px);
        }
        .score-summary-bar {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: #0A0F0D;
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            border: 1px solid #233529;
        }
        
        main {
            display: flex;
            padding: 2rem;
            gap: 2rem;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
            align-items: flex-start;
        }

        /* Sidebar Category Navigation */
        .sidebar {
            width: 300px;
            background: #141E18;
            border-radius: 12px;
            border: 1px solid #233529;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 6rem;
            padding: 1rem;
            gap: 0.5rem;
            max-height: calc(100vh - 8rem);
            overflow-y: auto;
        }
        .sidebar-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: #CCFF00;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }
        .cat-link {
            color: #94A3B8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .cat-link:hover {
            background: #233529;
            color: #F8FAFC;
        }

        /* Main Form Area */
        .audit-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3rem;
            min-width: 0;
        }
        .category-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .category-header {
            font-size: 1.5rem;
            font-weight: 800;
            color: #CCFF00;
            border-bottom: 2px solid #233529;
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
        }

        /* Individual Question Card */
        .q-card {
            background: #141E18;
            border: 1px solid #233529;
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .q-header {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }
        .q-num {
            background: rgba(204, 255, 0, 0.1);
            color: #CCFF00;
            font-weight: 800;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .q-text {
            font-size: 1.15rem;
            font-weight: 600;
            color: #F8FAFC;
            line-height: 1.4;
        }
        
        /* Input Row */
        .input-row {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .text-bubble {
            flex: 1;
            background: #0A0F0D;
            border: 1px solid #233529;
            border-radius: 8px;
            padding: 0.85rem 1rem;
            color: #F8FAFC;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .text-bubble:focus {
            outline: none;
            border-color: #CCFF00;
            box-shadow: 0 0 10px rgba(204, 255, 0, 0.15);
        }

        /* SOW Modal / Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .modal-overlay.active {
            display: flex;
        }
        .sow-modal-content {
            background: #141E18;
            border: 2px solid #CCFF00;
            border-radius: 16px;
            width: 100%;
            max-width: 950px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(204, 255, 0, 0.2);
        }
        .sow-modal-header {
            background: #0A0F0D;
            padding: 1.25rem 2rem;
            border-bottom: 1px solid #233529;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sow-modal-body {
            padding: 2.5rem;
            overflow-y: auto;
            font-family: inherit;
            color: #F1F5F9;
            line-height: 1.8;
            font-size: 0.95rem;
        }
        .sow-modal-footer {
            background: #0A0F0D;
            padding: 1rem 2rem;
            border-top: 1px solid #233529;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }
        .close-btn {
            background: transparent;
            border: none;
            color: #94A3B8;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .close-btn:hover { color: #F8FAFC; }
        
        /* Contractual SOW Formatting */
        .contract-title {
            text-align: center;
            font-size: 1.35rem;
            font-weight: 800;
            color: #CCFF00;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .contract-subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #94A3B8;
            margin-bottom: 2rem;
            border-bottom: 1px solid #233529;
            padding-bottom: 1rem;
        }
        .contract-section {
            margin-bottom: 2rem;
        }
        .contract-heading {
            font-size: 1rem;
            font-weight: 800;
            color: #CCFF00;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-bottom: 1px solid #233529;
            padding-bottom: 0.35rem;
        }
        .contract-p {
            color: #CBD5E1;
            margin-bottom: 1rem;
            text-align: justify;
        }

        /* Mobile & Tablet Responsive Media Queries */
        @media (max-width: 1024px) {
            main {
                flex-direction: column;
                padding: 1rem;
                gap: 1.5rem;
            }
            .sidebar {
                width: 100%;
                position: static;
                max-height: none;
            }
            header {
                padding: 1rem;
                flex-direction: column;
                gap: 0.75rem;
                align-items: stretch;
            }
            .score-summary-bar {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-badge">SOW</span>
            <span class="brand-title">Client Discovery & Contractual Scope of Work</span>
        </div>
        <div class="nav-actions">
            <button class="sow-btn" onclick="generateContractSOW()">📄 Generate Contractual SOW</button>
            <div class="score-summary-bar">
                <div style="font-size: 0.85rem; color: #94A3B8;">Captured:</div>
                <div style="font-size: 0.95rem; font-weight: 800; color: #CCFF00;" id="answered-count">0 / 56</div>
            </div>
        </div>
    </header>

    <main>
        <!-- Sidebar Category Navigation -->
        <div class="sidebar" id="sidebar-nav">
            <div class="sidebar-title">Categories</div>
        </div>

        <!-- Main Scrolling Audit Form -->
        <div class="audit-form" id="audit-form-container">
            <!-- Questions injected via JS -->
        </div>
    </main>

    <!-- Contractual SOW Modal Popup -->
    <div class="modal-overlay" id="sow-modal">
        <div class="sow-modal-content">
            <div class="sow-modal-header">
                <div style="font-size: 1.15rem; font-weight: 800; color: #CCFF00;">Contractual Statement of Work (SOW)</div>
                <button class="close-btn" onclick="closeSOWModal()">&times;</button>
            </div>
            <div class="sow-modal-body" id="sow-body-content">
                <!-- Contract generated dynamically -->
            </div>
            <div class="sow-modal-footer">
                <button class="sow-btn" onclick="window.print()" style="background: #233529; color: #F8FAFC; border: 1px solid #334a3b;">🖨️ Print / Save PDF</button>
                <button class="sow-btn" onclick="closeSOWModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const rawData = [
            {"qnum": "Q1", "category": "Logistics & Phasing", "question": "What is the maximum length of the road closures?"},
            {"qnum": "Q2", "category": "Logistics & Phasing", "question": "Type of road, construction only, public or private?"},
            {"qnum": "Q3", "category": "Logistics & Phasing", "question": "Are there any intersecting roads or driveways to be considered?"},
            {"qnum": "Q4", "category": "Logistics & Phasing", "question": "Length of shifts, or is it 24 hour requirement?"},
            {"qnum": "Q5", "category": "Logistics & Phasing", "question": "Job estimated duration?"},
            {"qnum": "Q6", "category": "Logistics & Phasing", "question": "Geological condition of job sites, forests, open farm land, existing roads?"},
            {"qnum": "Q7", "category": "Logistics & Phasing", "question": "How many project locations require temporary traffic signals?"},
            {"qnum": "Q8", "category": "Logistics & Phasing", "question": "Where are the project sites located (GPS coordinates or addresses)?"},
            {"qnum": "Q9", "category": "Logistics & Phasing", "question": "Is this a single project or multiple phases?"},
            {"qnum": "Q10", "category": "Logistics & Phasing", "question": "What is the anticipated project duration at each location?"},
            {"qnum": "Q11", "category": "Logistics & Phasing", "question": "What are the expected start and completion dates?"},
            {"qnum": "Q12", "category": "Logistics & Phasing", "question": "Will the signals remain in one location or be moved throughout the project?"},
            {"qnum": "Q13", "category": "Roadway & Traffic Ops", "question": "What is the roadway classification (township, county, state, private)?"},
            {"qnum": "Q14", "category": "Roadway & Traffic Ops", "question": "What is the posted speed limit?"},
            {"qnum": "Q15", "category": "Roadway & Traffic Ops", "question": "What is the average daily traffic (ADT), if known?"},
            {"qnum": "Q16", "category": "Roadway & Traffic Ops", "question": "Is the roadway paved or gravel?"},
            {"qnum": "Q17", "category": "Roadway & Traffic Ops", "question": "What is the roadway width?"},
            {"qnum": "Q18", "category": "Roadway & Traffic Ops", "question": "Why is alternating one-way traffic required?"},
            {"qnum": "Q19", "category": "Roadway & Traffic Ops", "question": "What is the length of the one-lane closure?"},
            {"qnum": "Q20", "category": "Roadway & Traffic Ops", "question": "Will the work zone length change during construction?"},
            {"qnum": "Q21", "category": "Roadway & Traffic Ops", "question": "Will construction equipment regularly enter and exit the work zone?"},
            {"qnum": "Q22", "category": "Roadway & Traffic Ops", "question": "Are oversized trucks or drilling equipment expected?"},
            {"qnum": "Q23", "category": "Roadway & Traffic Ops", "question": "Will traffic need to stop for blasting or specialized operations?"},
            {"qnum": "Q24", "category": "Roadway & Traffic Ops", "question": "Will traffic be maintained 24 hours per day?"},
            {"qnum": "Q25", "category": "Roadway & Traffic Ops", "question": "Will the signals operate continuously or only during work hours?"},
            {"qnum": "Q26", "category": "Roadway & Traffic Ops", "question": "What are the anticipated peak traffic periods?"},
            {"qnum": "Q27", "category": "Roadway & Traffic Ops", "question": "Is emergency vehicle access required?"},
            {"qnum": "Q28", "category": "Roadway & Traffic Ops", "question": "Is school bus traffic expected?"},
            {"qnum": "Q29", "category": "Roadway & Traffic Ops", "question": "Are there local residents requiring frequent access?"},
            {"qnum": "Q30", "category": "Comms, Power & Env", "question": "Has anyone verified cellular service at the project site?"},
            {"qnum": "Q31", "category": "Comms, Power & Env", "question": "Which carriers provide coverage (AT&T, Verizon, T-Mobile)?"},
            {"qnum": "Q32", "category": "Comms, Power & Env", "question": "Is any reliable cellular signal available?"},
            {"qnum": "Q33", "category": "Comms, Power & Env", "question": "Is commercial power available nearby?"},
            {"qnum": "Q34", "category": "Comms, Power & Env", "question": "Are generators permitted?"},
            {"qnum": "Q35", "category": "Permits & Specs", "question": "Who is the permitting authority?"},
            {"qnum": "Q36", "category": "Permits & Specs", "question": "Has a Maintenance and Protection of Traffic (MPT) or Traffic Control Plan been approved?"},
            {"qnum": "Q37", "category": "Permits & Specs", "question": "Is a professional engineer required to approve the signal layout?"},
            {"qnum": "Q38", "category": "Permits & Specs", "question": "Will PennDOT, the county, or a township inspect the installation?"},
            {"qnum": "Q39", "category": "Permits & Specs", "question": "Are there any special permit conditions?"},
            {"qnum": "Q40", "category": "Permits & Specs", "question": "Can our technicians access the site with pickup trucks?"},
            {"qnum": "Q41", "category": "Permits & Specs", "question": "Are there weight restrictions?"},
            {"qnum": "Q42", "category": "Permits & Specs", "question": "Will escorts be required?"},
            {"qnum": "Q43", "category": "Permits & Specs", "question": "Is the site accessible during all weather conditions?"},
            {"qnum": "Q44", "category": "Permits & Specs", "question": "Who is the onsite contact for deliveries and service calls?"},
            {"qnum": "Q45", "category": "Permits & Specs", "question": "Will you require 24/7 emergency support?"},
            {"qnum": "Q46", "category": "Permits & Specs", "question": "How quickly must service personnel respond if a signal malfunctions?"},
            {"qnum": "Q47", "category": "Permits & Specs", "question": "Who will monitor the equipment during off-hours?"},
            {"qnum": "Q48", "category": "Permits & Specs", "question": "Will daily inspections be required?"},
            {"qnum": "Q49", "category": "Industry & Heavy Ops", "question": "Which operator or energy company owns the lease?"},
            {"qnum": "Q50", "category": "Industry & Heavy Ops", "question": "Will heavy haul water trucks use the route?"},
            {"qnum": "Q51", "category": "Industry & Heavy Ops", "question": "What is the maximum truck volume expected per hour?"},
            {"qnum": "Q52", "category": "Industry & Heavy Ops", "question": "Are there periods when convoy traffic is expected?"},
            {"qnum": "Q53", "category": "Industry & Heavy Ops", "question": "Will drilling or fracking operations require around-the-clock access?"},
            {"qnum": "Q54", "category": "Industry & Heavy Ops", "question": "Are there any hazardous-material transportation requirements?"},
            {"qnum": "Q55", "category": "Industry & Heavy Ops", "question": "Is there a designated emergency evacuation route?"},
            {"qnum": "Q56", "category": "Industry & Heavy Ops", "question": "Will dust, mud, or snow impact signal visibility or operation?"}
        ];

        let answeredCount = 0;
        let clientAnswersStore = {};

        // Group data by category
        const categories = {};
        rawData.forEach((q, i) => {
            if (!categories[q.category]) categories[q.category] = [];
            q.globalIndex = i;
            categories[q.category].push(q);
        });

        const sidebar = document.getElementById('sidebar-nav');
        const mainForm = document.getElementById('audit-form-container');

        // Build the layout dynamically
        Object.keys(categories).forEach(cat => {
            const catId = cat.replace(/\s+/g, '-').replace('&', 'and').toLowerCase();
            
            const link = document.createElement('a');
            link.href = `#${catId}`;
            link.className = 'cat-link';
            link.innerText = cat;
            sidebar.appendChild(link);

            const section = document.createElement('div');
            section.className = 'category-section';
            section.id = catId;
            
            const header = document.createElement('div');
            header.className = 'category-header';
            header.innerText = cat;
            section.appendChild(header);

            categories[cat].forEach(q => {
                const card = document.createElement('div');
                card.className = 'q-card';
                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-num">${q.qnum}</span>
                        <span class="q-text">${q.question}</span>
                    </div>
                    <div class="input-row">
                        <input type="text" id="ans-${q.globalIndex}" class="text-bubble" placeholder="Type client's requirement or specification here..." oninput="autoSaveAnswer(${q.globalIndex})" onblur="autoSaveAnswer(${q.globalIndex})">
                    </div>
                `;
                section.appendChild(card);
            });

            mainForm.appendChild(section);
        });

        function autoSaveAnswer(idx) {
            const q = rawData[idx];
            const ansBox = document.getElementById(`ans-${idx}`);
            const ansText = ansBox.value.trim();
            
            const wasAnswered = clientAnswersStore[idx] !== undefined;

            if (ansText === '') {
                if (wasAnswered) {
                    delete clientAnswersStore[idx];
                    answeredCount--;
                    document.getElementById('answered-count').innerText = `${answeredCount} / 56`;
                }
            } else {
                if (!wasAnswered) {
                    answeredCount++;
                    document.getElementById('answered-count').innerText = `${answeredCount} / 56`;
                }
                clientAnswersStore[idx] = {
                    qnum: q.qnum,
                    question: q.question,
                    category: q.category,
                    answer: ansText
                };
            }
        }

        // Custom clean logical sentence generator for Section 2
        function formatIntoSentence(qnum, question, answer) {
            let ans = answer.trim();
            if (!ans.endsWith('.')) ans += '.';
            
            switch(qnum) {
                case 'Q1':
                    return `The maximum length of road closures will be ${ans.toLowerCase()}`;
                case 'Q2':
                    return `It is a ${ans.toLowerCase()}`;
                case 'Q3':
                    return `Regarding intersecting roads or driveways, ${ans.toLowerCase()}`;
                case 'Q4':
                    return `The shift requirement is ${ans.toLowerCase()}`;
                case 'Q5':
                    return `The estimated job duration is ${ans.toLowerCase()}`;
                case 'Q6':
                    return `The geological condition of the job site is ${ans.toLowerCase()}`;
                case 'Q7':
                    return `There are ${ans.toLowerCase()} project locations requiring temporary traffic signals.`;
                case 'Q8':
                    return `Project sites are located at ${ans.toLowerCase()}`;
                case 'Q9':
                    return `This project will be ${ans.toLowerCase()}`;
                case 'Q10':
                    return `The anticipated project duration at each location is ${ans.toLowerCase()}`;
                case 'Q11':
                    return `The expected start and completion dates are ${ans.toLowerCase()}`;
                case 'Q12':
                    return `Regarding signal placement, ${ans.toLowerCase()}`;
                default:
                    let qClean = question.trim();
                    if (qClean.endsWith('?')) qClean = qClean.slice(0, -1);
                    let lowerQ = qClean.toLowerCase();
                    if (lowerQ.startsWith('what is') || lowerQ.startsWith('what are') || lowerQ.startsWith('which')) {
                        return `The ${lowerQ.replace(/^(what is|what are|which)\s+/i, '')} will be ${ans.toLowerCase()}`;
                    } else if (lowerQ.startsWith('are there') || lowerQ.startsWith('is there') || lowerQ.startsWith('is this') || lowerQ.startsWith('will')) {
                        return `Regarding whether ${lowerQ}, ${ans.toLowerCase()}`;
                    } else {
                        return `For ${lowerQ}, ${ans.toLowerCase()}`;
                    }
            }
        }

        // Generate formal Contractual SOW with clean flowing prose paragraphs
        function generateContractSOW() {
            const modal = document.getElementById('sow-modal');
            const bodyContent = document.getElementById('sow-body-content');

            const answeredIndices = Object.keys(clientAnswersStore);
            if (answeredIndices.length === 0) {
                bodyContent.innerHTML = `<div style="color: #94A3B8; text-align: center; padding: 2rem;">Please fill out at least one requirement in the audit form before generating the Contractual Statement of Work.</div>`;
                modal.classList.add('active');
                return;
            }

            let html = `
                <div class="contract-title">Statement of Work (SOW)</div>
                <div class="contract-subtitle">Temporary Traffic Control & Operational Scope Agreement</div>

                <div class="contract-section">
                    <div class="contract-heading">1. Project Overview & Scope Authorization</div>
                    <p class="contract-p">This Statement of Work ("SOW") defines the operational parameters, site specifications, and contractual deliverables agreed upon between the parties for temporary traffic control services. All operations and deployed configurations shall comply fully with applicable MUTCD standards and local regulatory requirements.</p>
                </div>

                <div class="contract-section">
                    <div class="contract-heading">2. Project Operational Parameters & Site Scope</div>
            `;

            let combinedParagraph = "<p class=\"contract-p\">";
            answeredIndices.forEach(idx => {
                const item = clientAnswersStore[idx];
                combinedParagraph += formatIntoSentence(item.qnum, item.question, item.answer) + " ";
            });
            combinedParagraph += "</p>";

            html += combinedParagraph;

            html += `
                </div>
                <div class="contract-section">
                    <div class="contract-heading">3. Scope of Services & Operational Deliverables</div>
                    <p class="contract-p"><strong>Mobilization and Deployment:</strong> Contractor shall deliver, position, and commission all necessary temporary traffic control infrastructure in strict alignment with approved Maintenance and Protection of Traffic (MPT) plans and client specifications.</p>
                    <p class="contract-p"><strong>Ongoing Maintenance & Monitoring:</strong> Contractor shall maintain continuous operational readiness, ensuring proper functioning, routine system checks, and prompt response support throughout the duration of the project.</p>
                </div>

                <div class="contract-section">
                    <div class="contract-heading">4. Terms and Acceptance</div>
                    <p class="contract-p">Execution or acceptance of this document confirms that the audited parameters and operational requirements accurately represent the scope of work. Any subsequent modifications to site geometry, duration, or phasing require a formal written amendment signed by both authorized representatives.</p>
                </div>
            `;

            bodyContent.innerHTML = html;
            modal.classList.add('active');
        }

        function closeSOWModal() {
            document.getElementById('sow-modal').classList.remove('active');
        }
    </script>
</body>
</html>
